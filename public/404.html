<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Nativa</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any unknown path (e.g. a deep link
      // like /productos/miel), so it re-encodes the path into a query string
      // and redirects to index.html, which restores it (see index.html).
      var pathSegmentsToKeep = location.hostname.endsWith('github.io') ? 1 : 0

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
